[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "binproof"
version = "0.4.0"
description = "AI-assisted, evidence-checked reverse engineering on top of Ghidra"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pydantic>=2"]
extract = ["pyghidra"]
ai = ["pydantic>=2"]

[project.scripts]
binproof = "binproof.cli:main"

[tool.setuptools]
packages = ["binproof", "binproof.ai", "binproof.ai.providers", "binproof.validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
